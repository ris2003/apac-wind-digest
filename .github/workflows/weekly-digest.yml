name: Weekly APAC Offshore Wind Digest

on:
  schedule:
    # 23:00 UTC Sunday = 07:00 Monday Taipei/China/Philippines time (UTC+8)
    - cron: '0 23 * * 0'
  workflow_dispatch: {}   # lets you click "Run workflow" manually to test

jobs:
  run-digest:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install feedparser requests

      - name: Run monitor and send email
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          DIGEST_RECIPIENTS: ${{ secrets.DIGEST_RECIPIENTS }}
        run: python monitor.py

      - name: Upload digest as a workflow artifact (backup copy)
        uses: actions/upload-artifact@v4
        with:
          name: weekly-digest
          path: digest_*.md
